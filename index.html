* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 Barlow, -apple-system, BlinkMacSystemFont, sans-serif; display: grid; grid-template-columns: minmax(0, 380px); justify-content: center; align-content: center;

.logo { width: 60px; height: 60px; flex: none; }
.word { display: grid; line-height: 1; }
.word b { font-family: Quicksand, Barlow, sans-serif; font-weight: 600; font-size: 34px; letter-spacing: .01em; color: var(--accent); }
.word span { margin-top: 6px; font-size: 12px; font-weight: 600; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); }
form { display: grid; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
label.l { font-weight: 600; font-size: 15px; }
.pw { display: flex; gap: 8px; }
input[type=password], input[type=text] { flex: 1; min-width: 0; height: 48px; padding: 0 12px; font: inherit; font-size: 18px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.show { height: 48px; padding: 0 12px; font: inherit; font-size: 14px; font-weight: 600; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 8px; }
.chk { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--muted); }
.chk input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
.go { height: 50px; font: inherit; font-size: 17px; font-weight: 600; color: #1D2220; background: var(--accent); border: 0; border-radius: 8px; }
.go:disabled { opacity: .6; }
.msg { min-height: 20px; margin: 0; font-size: 14px; color: var(--bad); }
.foot { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }

  const LS = 'werkplaats.slot.v1';
  const $ = id => document.getElementById(id);
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const get = () => { try { return localStorage.getItem(LS); } catch (e) { return null; } };
  const set = v => { try { if (v) localStorage.setItem(LS, v); else localStorage.removeItem(LS); } catch (e) { /* geen opslag */ } };
  async function keyFrom(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(D.s), iterations: D.n }, base, 256);
  }
  async function open(raw) {
    const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(D.i) }, k, bytes(D.c));
    return new TextDecoder().decode(plain);
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  // eerder onthouden op dit apparaat? dan meteen openen
  const saved = get();
  if (saved) {
    open(bytes(saved)).then(show).catch(() => { set(null); });
  }
  $('show').addEventListener('click', () => {
    const on = $('ww').type === 'password';
    $('ww').type = on ? 'text' : 'password';
    $('show').textContent = on ? 'Verberg' : 'Toon';
    $('show').setAttribute('aria-pressed', String(on));
  });
  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    const pw = $('ww').value;
    if (!pw) return;
    $('go').disabled = true; $('go').textContent = 'Even geduld…'; $('msg').textContent = '';
    try {
      const raw = await keyFrom(pw);
      const html = await open(raw);
      set($('keep').checked ? toB64(raw) : null);
      show(html);
    } catch (err) {
      $('msg').textContent = window.crypto && crypto.subtle ? 'Dat wachtwoord klopt niet.' : 'Deze browser kan de app niet openen. Gebruik Safari of Chrome.';
      $('go').disabled = false; $('go').textContent = 'Openen';
      $('ww').select();
    }
  });
})();
